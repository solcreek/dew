[workspace]
resolver = "2"
members = ["dew-proto", "dew-agent"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/solcreek/dew"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
