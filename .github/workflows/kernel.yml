name: Turbo Kernel Build

on:
  push:
    paths:
      - 'kernel/**'
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Build turbo kernel
        run: |
          docker build --output type=local,dest=out kernel/
          mv out/vmlinuz-turbo vmlinuz-turbo
          ls -lh vmlinuz-turbo
          sha256sum vmlinuz-turbo

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: vmlinuz-turbo
          path: vmlinuz-turbo

      - name: Verify kernel config
        run: |
          echo "Diff from Alpine base (should only be m->y changes):"
          diff kernel/config-alpine-base kernel/config-turbo || true
