name: Kernel Build

on:
  push:
    paths:
      - 'kernel/**'
    branches: [main]
  workflow_dispatch:

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Build x86_64 monolithic kernel
        run: |
          docker build -f kernel/Dockerfile.dew-virt --output type=local,dest=out kernel/
          mv out/vmlinuz-dew-virt vmlinuz-x86_64
          ls -lh vmlinuz-x86_64
          sha256sum vmlinuz-x86_64

      - name: Upload x86_64 kernel
        uses: actions/upload-artifact@v6
        with:
          name: vmlinuz-x86_64
          path: vmlinuz-x86_64

  download-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KATA_VERSION: "3.28.0"
      KATA_KERNEL: "vmlinux-6.18.15-186"
    steps:
      - name: Download Kata ARM64 kernel
        run: |
          curl -fsSL -o kata-arm64.tar.zst \
            "https://github.com/kata-containers/kata-containers/releases/download/${KATA_VERSION}/kata-static-${KATA_VERSION}-arm64.tar.zst"
          zstd -d kata-arm64.tar.zst
          tar xf kata-arm64.tar --wildcards "*/vmlinux-*" --strip-components=5
          mv ${KATA_KERNEL} vmlinuz-arm64
          ls -lh vmlinuz-arm64
          sha256sum vmlinuz-arm64
          rm -f kata-arm64.tar kata-arm64.tar.zst

      - name: Upload ARM64 kernel
        uses: actions/upload-artifact@v6
        with:
          name: vmlinuz-arm64
          path: vmlinuz-arm64

  verify-x86_64:
    needs: build-x86_64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Download kernel artifact
        uses: actions/download-artifact@v6
        with:
          name: vmlinuz-x86_64

      - name: Build dew + minimal initramfs
        run: |
          go build -ldflags="-s -w" -o dew ./cmd/dew/
          codesign --entitlements entitlements.plist --force -s - dew
          bash initramfs/build.sh minimal
          mkdir -p ~/.local/share/dew
          cp vmlinuz-x86_64 ~/.local/share/dew/vmlinuz

      - name: Boot test
        run: |
          echo "=== Boot + exec test ==="
          RESULT=$(./dew run --json -- uname -r 2>/dev/null)
          echo "$RESULT"
          echo "$RESULT" | grep -q "exit_code" || { echo "FAIL: no structured output"; exit 1; }
          echo "=== Filesystem check ==="
          ./dew run --json -- cat /proc/filesystems 2>/dev/null | grep -q "ext4" || echo "WARN: ext4 not in /proc/filesystems"
          echo "=== PASS ==="

  verify-arm64:
    needs: download-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Download kernel artifact
        uses: actions/download-artifact@v6
        with:
          name: vmlinuz-arm64

      - name: Build dew + minimal initramfs
        run: |
          go build -ldflags="-s -w" -o dew ./cmd/dew/
          codesign --entitlements entitlements.plist --force -s - dew
          bash initramfs/build.sh minimal
          mkdir -p ~/.local/share/dew
          cp vmlinuz-arm64 ~/.local/share/dew/vmlinuz

      - name: Boot test
        run: |
          echo "=== Boot + exec test ==="
          RESULT=$(./dew run --json -- uname -r 2>/dev/null)
          echo "$RESULT"
          echo "$RESULT" | grep -q "exit_code" || { echo "FAIL: no structured output"; exit 1; }
          echo "=== PASS ==="
