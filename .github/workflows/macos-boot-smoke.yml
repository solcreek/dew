name: macOS boot smoke

# End-to-end VM boot test against the latest released dew binary on
# each supported macOS image. Catches the regression class that build
# + unit tests miss: install script breakage, GHA runner image drift,
# OS-version-specific VZ behavior changes, kernel/initramfs format
# issues in the published assets.
#
# Why not build dew from the current branch and smoke that:
#   Apple Virtualization on Apple Silicon refuses ad-hoc-signed
#   binaries even with the VZ entitlement embedded — VM start
#   immediately fails with VZErrorDomain Code=1. A real boot smoke
#   needs a Developer ID-signed binary, which only the tagged release
#   produces (via the Apple cert in release.yml secrets). Per-PR boot
#   coverage of the freshly-built binary would require copying those
#   secrets to this workflow, expanding the blast radius for a cert
#   that should live behind one workflow only.
#
# What this DOES catch per PR / push (using the latest released
# binary on the runner):
#   - install.sh regression — script can't fetch, extract, or chmod
#   - asset URLs broken in latest release
#   - GHA runner image drift — Apple shipped a VZ tweak in a minor
#     macOS update that breaks an older released binary
#   - kernel/initramfs format issue in the published assets
#
# What this does NOT catch:
#   - per-PR code changes in dew itself. Unit tests + dew doctor cover
#     a big chunk; the real verification is the release-time boot.
#   - new CPU generations — GHA only offers M1 (free) and M2 (paid
#     xlarge); M3+ users are covered by the diagnostic dump + repo
#     compat banner.
#
# Matrix covers macos-14 / 15 / 26 (every supported OS, all M1 ARM).
# DEW_DEBUG=1 ensures any failure includes the VM config dump.

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'website/scripts/sync-install-scripts.mjs'
      - '.github/workflows/macos-boot-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'install.sh'
      - 'website/scripts/sync-install-scripts.mjs'
      - '.github/workflows/macos-boot-smoke.yml'
  schedule:
    # Weekly — the main driver. Catches GHA runner-image drift +
    # macOS minor-version VZ tweaks even when nothing in our repo
    # changes.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one OS failure shouldn't mask the others
      matrix:
        os: [macos-14, macos-15, macos-26]
    steps:
      - name: Host info
        run: |
          echo "Mac model:   $(sysctl -n hw.model)"
          echo "CPU brand:   $(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo n/a)"
          echo "macOS:       $(sw_vers -productVersion) (build $(sw_vers -buildVersion))"
          echo "Kernel:      $(uname -srm)"
          echo "Memory:      $(sysctl -n hw.memsize) bytes"

      - name: Install dew via official installer
        run: |
          set -euo pipefail
          curl -fsSL https://dewvm.dev/install.sh | sh
          # The installer drops dew in ~/.local/share/dew/bin/<ver>/dew
          # and adds a shim into ~/.local/bin (or symlink). Add both to
          # PATH so subsequent steps can just say `dew`.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/dew/bin" >> "$GITHUB_PATH"

      - name: dew version
        run: dew version

      - name: dew doctor --verbose
        # Informational — surfaces signing chain, entitlement, asset
        # state, plus the VM config dump if the embedded boot test
        # runs. `|| true` so a doctor warning doesn't abort the more
        # interesting explicit smoke that follows.
        run: dew doctor --verbose || true

      - name: Boot smoke — dew run -- echo SMOKE_OK
        env:
          DEW_DEBUG: "1"
        run: |
          set -o pipefail
          OUT=$(dew run --profile minimal -- echo SMOKE_OK 2>&1) || STATUS=$?
          STATUS=${STATUS:-0}
          echo "── dew output ──"
          echo "$OUT"
          echo "────────────────"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::dew run exited $STATUS"
            exit "$STATUS"
          fi
          if ! echo "$OUT" | grep -q SMOKE_OK; then
            echo "::error::expected SMOKE_OK in output, did not see it"
            exit 1
          fi
          echo "✓ boot + exec round-trip OK"
