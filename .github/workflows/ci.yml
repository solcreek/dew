name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -v

      - name: Cross-compile guest agent
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dew-agent-linux-amd64 ./cmd/dew-agent/
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o dew-agent-linux-arm64 ./cmd/dew-agent/
          ls -lh dew-agent-linux-*

  # The guest agent is //go:build linux and can't run on the macOS test
  # job above (go test skips linux-tagged files there). Run its tests
  # natively on Linux so the agent's behavior — including the exec stdin
  # wiring — is actually exercised, not just cross-compiled.
  test-linux-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Test guest agent + shared protocol (linux)
        run: go test -count=1 -v ./cmd/dew-agent/ ./internal/vsock/

  # Rust workspace (rust/): the guest-agent migration, see
  # docs/rust-agent-migration.md. dew-proto's golden test decodes the frames
  # the Go encoder wrote to internal/vsock/testdata/golden/, so drift between
  # the two protocol implementations fails here; test-linux-agent's
  # ./internal/vsock run checks those files are current on the Go side.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # Guest agent binaries for both VM arches: static musl, linked with the
      # toolchain's rust-lld (rust/.cargo/config.toml). Not shipped yet; this
      # keeps the cross-build green and tracks the size.
      - name: Cross-build guest agent (musl)
        run: |
          for t in aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            cargo build --locked --release -p dew-agent --target "$t"
            f="target/$t/release/dew-agent"
            file "$f"
            echo "dew-agent $t: $(stat -c %s "$f") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # main.rs and vsock.rs only run inside a guest (AF_VSOCK); they are
      # exercised end to end, not by unit tests, so they are left out of the
      # floor. Everything else must stay at or above 95% of lines.
      # `shell: bash` makes Actions run `bash -eo pipefail`; the implicit
      # shell is plain `bash -e`, where `| tee` would swallow the floor's
      # failure and pass the step.
      - name: Coverage
        shell: bash
        run: |
          rustup component add llvm-tools
          cargo llvm-cov --locked --workspace --summary-only \
            --ignore-filename-regex '(main|vsock)\.rs$' \
            --fail-under-lines 95 | tee -a "$GITHUB_STEP_SUMMARY"

  # dew-win is //go:build windows and is skipped by the macOS test job
  # (go test ./... excludes windows-tagged files there). Build and test
  # it natively on Windows so the wrapper's pure helpers — exec/argv
  # building, wsl --list parsing, .wslconfig and package.json detection —
  # are compiled and exercised, and windows/arm64 build breaks (which no
  # other job would catch) surface here.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build dew-win
        run: go build ./cmd/dew-win/

      - name: Test dew-win
        run: go test ./cmd/dew-win/ -count=1 -v -cover

      - name: Cross-compile dew-win (windows/arm64)
        run: go build ./cmd/dew-win/
        env:
          GOOS: windows
          GOARCH: arm64

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run npm dispatcher + scripts tests
        working-directory: npm
        run: npm test
