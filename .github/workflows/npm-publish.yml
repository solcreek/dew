name: Publish Package

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Sync version from git tag
        working-directory: npm
        run: |
          # Get version from the tag that triggered the Release workflow
          VERSION=$(gh api repos/solcreek/dew/releases/latest --jq .tag_name | sed 's/^v//')
          npm version "$VERSION" --no-git-tag-version --allow-same-version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish (skip if version exists)
        working-directory: npm
        run: npm publish --provenance --access public || echo "Version already published, skipping"
