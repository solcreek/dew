name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write


jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Set up signing keychain
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: bash scripts/setup-signing-keychain.sh

      - name: Build dew binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dew-darwin-arm64 ./cmd/dew/
          GOARCH=amd64 CGO_ENABLED=1 go build -ldflags="$LDFLAGS" -o dew-darwin-amd64 ./cmd/dew/ || echo "x86_64 cross-compile skipped"

      - name: Sign macOS binaries
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          BINS="dew-darwin-arm64"
          [ -f dew-darwin-amd64 ] && BINS="$BINS dew-darwin-amd64"
          bash scripts/codesign.sh $BINS

      - name: Notarize macOS binaries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          BINS="dew-darwin-arm64"
          [ -f dew-darwin-amd64 ] && BINS="$BINS dew-darwin-amd64"
          bash scripts/notarize.sh $BINS

      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Build ARM64 initramfs
        run: |
          bash initramfs/build.sh minimal
          bash initramfs/build.sh node
          bash initramfs/build.sh standard
          cp initramfs/vmlinuz vmlinuz-aarch64
          cp initramfs/initramfs-minimal.cpio.gz initramfs-minimal-aarch64.cpio.gz
          cp initramfs/initramfs-node.cpio.gz initramfs-node-aarch64.cpio.gz
          cp initramfs/initramfs-standard.cpio.gz initramfs-standard-aarch64.cpio.gz

      - name: Download Kata ARM64 kernel
        run: |
          curl -fsSL -o kata-arm64.tar.zst "https://github.com/kata-containers/kata-containers/releases/download/3.28.0/kata-static-3.28.0-arm64.tar.zst"
          zstd -d kata-arm64.tar.zst
          tar xf kata-arm64.tar --wildcards "*/vmlinux-*" --strip-components=5 || true
          mv vmlinux-* vmlinuz-aarch64 2>/dev/null || true
          rm -f kata-arm64.tar kata-arm64.tar.zst

      - name: Upload binaries + ARM64 assets
        uses: actions/upload-artifact@v6
        with:
          name: macos-binaries
          path: |
            dew-darwin-*
            vmlinuz-aarch64
            initramfs-*-aarch64.cpio.gz

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build guest agent
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dew-agent-linux-amd64 ./cmd/dew-agent/
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dew-agent-linux-arm64 ./cmd/dew-agent/

      - name: Build dew (Linux)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o dew-linux-amd64 ./cmd/dew-linux/
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -o dew-linux-arm64 ./cmd/dew-linux/

      - name: Build Windows wrapper
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dew-windows-x86_64.exe ./cmd/dew-win/

      - name: Build initramfs profiles
        run: bash initramfs/build.sh minimal && bash initramfs/build.sh node && bash initramfs/build.sh standard

      - name: Rename assets with arch
        run: |
          ARCH=$(uname -m)
          cp initramfs/vmlinuz vmlinuz-${ARCH}
          cp initramfs/initramfs-minimal.cpio.gz initramfs-minimal-${ARCH}.cpio.gz
          cp initramfs/initramfs-node.cpio.gz initramfs-node-${ARCH}.cpio.gz
          cp initramfs/initramfs-standard.cpio.gz initramfs-standard-${ARCH}.cpio.gz

      - name: Build WSL2 rootfs
        run: |
          # Create a WSL2-compatible rootfs from the standard initramfs
          mkdir -p /tmp/wsl-rootfs
          cd /tmp/wsl-rootfs
          gzip -dc $GITHUB_WORKSPACE/initramfs/initramfs-standard.cpio.gz | cpio -id 2>/dev/null
          tar czf $GITHUB_WORKSPACE/dew-rootfs-x86_64.tar.gz .

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-assets
          path: |
            dew-agent-linux-*
            dew-linux-*
            dew-windows-x86_64.exe
            vmlinuz-*
            initramfs-*
            dew-rootfs-*

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write           # required for npm provenance attestations
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create install scripts
        run: |
          cat > artifacts/install.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          REPO="solcreek/dew"
          ARCH="$(uname -m)"
          OS="$(uname -s)"
          DEST="${DEST:-/usr/local/bin}"

          case "$OS" in
            Darwin) BINARY="dew-darwin-${ARCH}" ;;
            Linux)
              [ "$ARCH" = "aarch64" ] && ARCH="arm64"
              BINARY="dew-linux-${ARCH}"
              ;;
            *) echo "dew: unsupported OS $OS. For Windows: irm https://github.com/$REPO/releases/latest/download/install.ps1 | iex"; exit 1 ;;
          esac

          URL="https://github.com/$REPO/releases/latest/download/$BINARY"
          echo "dew: downloading $BINARY..."
          curl -fsSL -o "$DEST/dew" "$URL"
          chmod +x "$DEST/dew"

          # macOS: release binaries are already Developer ID signed + notarized
          # in CI. Do NOT re-sign (that would strip the Developer ID and break
          # the virtualization entitlement). Only ad-hoc-sign as a last resort
          # if no Developer ID signature is present (e.g. a custom build).
          if [ "$OS" = "Darwin" ]; then
            if ! codesign -dv "$DEST/dew" 2>&1 | grep -q "Developer ID Application"; then
              codesign --entitlements <(printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>com.apple.security.virtualization</key><true/></dict></plist>') --force -s - "$DEST/dew" 2>/dev/null || true
            fi
          fi

          echo "dew: installed to $DEST/dew"
          echo "dew: try 'dew app run excalidraw --port 3000'"
          SCRIPT
          chmod +x artifacts/install.sh
          cp ${{ github.workspace }}/install.ps1 artifacts/install.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/*

      # --- npm publish (replaces former npm-publish.yml workflow) ---
      # Publishes 6 packages in one workflow: 5 per-platform packages
      # (@solcreek/dew-<triple>) carrying the signed + notarized binaries,
      # plus the main @solcreek/dew dispatcher pinned to the same version.

      - uses: actions/setup-node@v6
        with:
          # node 24 → npm 11.x. OIDC Trusted Publishers require npm >= 11.5.1;
          # node 20 ships npm 10.x and fails with ENEEDAUTH on publish.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Sanity-test npm dispatcher + scripts
        working-directory: npm
        run: npm test

      - name: Sync npm version to git tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node npm/scripts/sync-version.mjs "$VERSION"

      - name: Generate per-platform packages from release binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node npm/scripts/generate-packages.mjs "$VERSION" artifacts tmp/platform-pkgs
          ls tmp/platform-pkgs

      - name: Publish per-platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in tmp/platform-pkgs/*/; do
            echo "::group::Publish $(basename "$dir")"
            (cd "$dir" && npm publish --provenance --access public) || \
              echo "Skipped (likely already published)"
            echo "::endgroup::"
          done

      - name: Publish main package
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public || echo "Skipped (likely already published)"
