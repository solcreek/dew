name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # goreleaser creates the GitHub Release
  id-token: write   # cosign keyless + npm OIDC trusted publisher + SLSA

jobs:
  # ─── Guard: published release assets are IMMUTABLE.
  #     dew binaries fetch kernel/initramfs from
  #     /releases/download/v<tag>/ and verify the bytes against a SHA
  #     baked into the binary at build time. Overwriting a tag's assets
  #     after publish therefore bricks every older pinned install: it
  #     requests the new bytes, compares them to its old baked SHA, and
  #     fails the verify forever. So if a tag already has its assets,
  #     refuse to re-publish — cut a NEW tag instead. A failed first run
  #     (release shell created but no assets uploaded yet) still retries
  #     cleanly because the sentinel asset won't be present.
  guard-immutable-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to overwrite already-published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Asset whose bytes are SHA-pinned into shipped binaries; its
          # presence means this tag was already fully published.
          SENTINEL="initramfs-node-aarch64.cpio.gz"
          if ! gh release view "$TAG" --repo "$REPO" --json assets >/tmp/rel.json 2>/dev/null; then
            echo "No existing release for $TAG — clean to publish."
            exit 0
          fi
          if jq -e --arg n "$SENTINEL" '.assets[] | select(.name == $n)' /tmp/rel.json >/dev/null; then
            echo "::error::Release $TAG already has published assets ($SENTINEL)."
            echo "Published release assets are immutable: older pinned dew binaries"
            echo "fetch /releases/download/$TAG/ and verify against a baked SHA, so"
            echo "overwriting them bricks every older pin. Cut a NEW tag instead."
            exit 1
          fi
          echo "Release $TAG exists but has no published assets yet — retry OK."

  # ─── Build darwin binaries: signed, notarized, ready for goreleaser
  #     archive. aarch64 initramfs is cross-built on the Linux runner
  #     (where the apk-tools-static bake works) — see build-linux below.
  build-macos:
    # Depends on build-linux for the asset SHA manifest: the darwin
    # binaries must embed ExpectedAssetSHA BEFORE they're compiled, or
    # they ship with an empty map and fall back to legacy un-versioned
    # cache paths — reusing a stale kernel/initramfs across upgrades
    # (the v0.7.40 "boots the old kernel" regression). goreleaser's
    # prebuilt builder only packages these binaries; it can't re-embed.
    needs: [build-linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Set up signing keychain
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: bash scripts/setup-signing-keychain.sh

      - name: Download asset SHA manifest
        uses: actions/download-artifact@v8
        with:
          name: asset-shas
          path: ${{ runner.temp }}/shas

      - name: Generate cmd/dew/assets_shas_generated.go (embed asset SHAs)
        run: bash scripts/gen-asset-shas.sh ${{ runner.temp }}/shas/assets-shas.txt cmd/dew/assets_shas_generated.go

      - name: Build dew darwin binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          GOARCH=arm64 go build -trimpath -ldflags="$LDFLAGS" -o dew-darwin-arm64 ./cmd/dew/
          GOARCH=amd64 CGO_ENABLED=1 go build -trimpath -ldflags="$LDFLAGS" -o dew-darwin-amd64 ./cmd/dew/ || echo "x86_64 cross-compile skipped"

      - name: Sign macOS binaries
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          BINS="dew-darwin-arm64"
          [ -f dew-darwin-amd64 ] && BINS="$BINS dew-darwin-amd64"
          bash scripts/codesign.sh $BINS

      - name: Notarize macOS binaries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          BINS="dew-darwin-arm64"
          [ -f dew-darwin-amd64 ] && BINS="$BINS dew-darwin-amd64"
          bash scripts/notarize.sh $BINS

      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Lay out darwin binaries for goreleaser prebuilt builder
        # .goreleaser.yaml prebuilt.path = prebuilt/dew-darwin-{{ .Arch }}/dew
        # (outside dist/ so `goreleaser release --clean` doesn't wipe them)
        run: |
          mkdir -p prebuilt/dew-darwin-arm64 prebuilt/dew-darwin-amd64
          cp dew-darwin-arm64 prebuilt/dew-darwin-arm64/dew
          [ -f dew-darwin-amd64 ] && cp dew-darwin-amd64 prebuilt/dew-darwin-amd64/dew || true

      - name: Upload darwin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-binaries
          path: |
            prebuilt/dew-darwin-arm64/dew
            prebuilt/dew-darwin-amd64/dew
          include-hidden-files: false

  # ─── Build Linux auxiliary assets: dew-agent (guest), windows
  #     wrapper, x86_64 initramfs profiles, WSL2 rootfs. The Linux
  #     `dew` CLI binary is built by goreleaser in the release job,
  #     not here.
  build-linux:
    needs: [guard-immutable-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build guest agent
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dew-agent-linux-amd64 ./cmd/dew-agent/
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dew-agent-linux-arm64 ./cmd/dew-agent/

      - name: Build Windows wrappers (x86_64 + arm64)
        # Two targets because Windows-on-ARM (Snapdragon laptops, the
        # Apple Silicon Windows VMs people use to validate Windows
        # support) can't run the x86_64 binary end-to-end: Microsoft's
        # x64 emulator (Prism) needs hardware virtualization to work,
        # and that's exactly what an emulated Apple Silicon Windows
        # guest doesn't have. The arm64 build runs natively on both
        # real Windows-ARM hardware and emulated guests.
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dew-windows-x86_64.exe ./cmd/dew-win/
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o dew-windows-arm64.exe ./cmd/dew-win/

      - name: Build x86_64 initramfs profiles
        run: bash initramfs/build.sh minimal && bash initramfs/build.sh node && bash initramfs/build.sh standard

      - name: Rename x86_64 initramfs assets with arch
        run: |
          cp initramfs/vmlinuz vmlinuz-x86_64
          cp initramfs/initramfs-minimal.cpio.gz initramfs-minimal-x86_64.cpio.gz
          cp initramfs/initramfs-node.cpio.gz initramfs-node-x86_64.cpio.gz
          cp initramfs/initramfs-standard.cpio.gz initramfs-standard-x86_64.cpio.gz

      - name: Build WSL2 rootfs
        run: |
          mkdir -p /tmp/wsl-rootfs
          cd /tmp/wsl-rootfs
          gzip -dc $GITHUB_WORKSPACE/initramfs/initramfs-standard.cpio.gz | cpio -id 2>/dev/null
          tar czf $GITHUB_WORKSPACE/dew-rootfs-x86_64.tar.gz .

      # aarch64 initramfs is cross-built from the Linux x86_64 runner so the
      # nodejs+npm bake (HOST_OS=Linux only) runs for both arches. apk-tools-
      # static uses --arch to cross-install aarch64 packages, and Go cross-
      # compiles the agent trivially. macOS runner used to do this without
      # the bake, causing 30-60 s of first-boot apk install on Apple Silicon.
      - name: Build aarch64 initramfs profiles (cross-built)
        run: |
          TARGET_ARCH=aarch64 bash initramfs/build.sh minimal
          TARGET_ARCH=aarch64 bash initramfs/build.sh node
          TARGET_ARCH=aarch64 bash initramfs/build.sh standard

      - name: Rename aarch64 initramfs assets with arch
        run: |
          cp initramfs/vmlinuz vmlinuz-aarch64
          cp initramfs/initramfs-minimal.cpio.gz initramfs-minimal-aarch64.cpio.gz
          cp initramfs/initramfs-node.cpio.gz initramfs-node-aarch64.cpio.gz
          cp initramfs/initramfs-standard.cpio.gz initramfs-standard-aarch64.cpio.gz

      - name: Build WSL2 rootfs (aarch64)
        # Runs AFTER the aarch64 initramfs build because that step
        # overwrites initramfs/initramfs-standard.cpio.gz with the
        # aarch64 version (the x86_64 rootfs above was tarred while
        # initramfs/* still held the x86_64 archive). Same recipe
        # as the x86_64 path — extract the standard cpio, repack as
        # tar.gz for WSL2 import. Required so `dew setup` on
        # Windows-on-ARM has a matching rootfs to fetch; WSL2 on
        # ARM runs an aarch64 kernel and rejects an x86_64 rootfs.
        run: |
          mkdir -p /tmp/wsl-rootfs-aarch64
          cd /tmp/wsl-rootfs-aarch64
          gzip -dc $GITHUB_WORKSPACE/initramfs/initramfs-standard.cpio.gz | cpio -id 2>/dev/null
          tar czf $GITHUB_WORKSPACE/dew-rootfs-aarch64.tar.gz .

      - name: Compute asset SHAs (for dew binary's embedded manifest)
        # Hashes the kernel + initramfs files dew downloads at runtime,
        # so the goreleaser job can bake the expected values into the
        # binary. The dew binary then verifies its cached assets match
        # the SHA shipped in the same release tag — a stale or corrupt
        # cached file (the 2026-06 M4 Max class of bug) is detected
        # before Apple VZ returns Code=1.
        run: |
          sha256sum \
            vmlinuz-x86_64 \
            vmlinuz-aarch64 \
            initramfs-minimal-x86_64.cpio.gz \
            initramfs-node-x86_64.cpio.gz \
            initramfs-standard-x86_64.cpio.gz \
            initramfs-minimal-aarch64.cpio.gz \
            initramfs-node-aarch64.cpio.gz \
            initramfs-standard-aarch64.cpio.gz \
            > assets-shas.txt
          cat assets-shas.txt

      - name: Upload asset SHA manifest
        # Small standalone artifact so build-macos can embed the SHAs
        # into the darwin binaries without pulling the ~150 MB of
        # initramfs in linux-assets.
        uses: actions/upload-artifact@v7
        with:
          name: asset-shas
          path: assets-shas.txt

      - name: Upload linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-assets
          path: |
            dew-agent-linux-*
            dew-windows-*.exe
            vmlinuz-x86_64
            initramfs-*-x86_64.cpio.gz
            vmlinuz-aarch64
            initramfs-*-aarch64.cpio.gz
            dew-rootfs-*.tar.gz
            assets-shas.txt

  # ─── Goreleaser is the orchestrator: archives signed darwin
  #     binaries (consumed as prebuilt), cross-compiles linux dew,
  #     produces tar.gz + checksums.txt, cosign-signs the checksum
  #     file, creates the GitHub Release, and auto-PRs the formula
  #     to solcreek/homebrew-tap.
  goreleaser:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # goreleaser needs full history for changelog

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: install cosign
        uses: sigstore/cosign-installer@v4
        with:
          cosign-release: "v2.4.1"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          # Outside the repo tree so goreleaser's "git dirty" check
          # doesn't trip on the untracked download dir.
          path: ${{ runner.temp }}/artifacts
          merge-multiple: false

      - name: Stage darwin binaries where goreleaser prebuilt expects
        run: |
          # upload-artifact strips the common path prefix, so when all
          # uploaded paths sit under `prebuilt/` the artifact root is
          # the `dew-darwin-{arch}/` directories themselves.
          mkdir -p prebuilt
          cp -r ${{ runner.temp }}/artifacts/macos-binaries/dew-darwin-* prebuilt/
          ls -la prebuilt/dew-darwin-*/

      - name: Generate cmd/dew/assets_shas_generated.go
        # Bake the SHA256 of every release asset dew downloads at runtime
        # into the (linux) binaries goreleaser compiles here, so cached
        # files are content-addressed and verified against the bytes
        # shipped in the SAME release tag. The darwin binaries embed the
        # same map in build-macos (see that job). Shared generator keeps
        # the two in lockstep.
        run: bash scripts/gen-asset-shas.sh ${{ runner.temp }}/artifacts/linux-assets/assets-shas.txt cmd/dew/assets_shas_generated.go
          gofmt -w "$OUT"

      - name: Mint short-lived token for homebrew-tap
        # Org-owned GitHub App `solcreek-tap-publisher`. Token is scoped to
        # the tap repo + expires in ~1h. No PAT, no user-bound binding.
        # Explicit permission-* inputs ensure the minted token includes
        # write access even if the install-token inheritance gets quirky.
        uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: solcreek
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Stage auxiliary assets for goreleaser
        # checksum.extra_files + release.extra_files in .goreleaser.yaml
        # both glob prebuilt/aux/* — goreleaser uploads these alongside
        # the release AND folds their SHA256 into the cosign-signed
        # checksums.txt. Explicit list (not *) so internal files like
        # assets-shas.txt can never leak into the release. prebuilt/ is
        # untracked, which goreleaser's dirty check (diff-index) ignores.
        env:
          ARTIFACTS: ${{ runner.temp }}/artifacts
        run: |
          mkdir -p prebuilt/aux
          cp \
            "$ARTIFACTS/linux-assets/vmlinuz-aarch64" \
            "$ARTIFACTS/linux-assets/initramfs-minimal-aarch64.cpio.gz" \
            "$ARTIFACTS/linux-assets/initramfs-node-aarch64.cpio.gz" \
            "$ARTIFACTS/linux-assets/initramfs-standard-aarch64.cpio.gz" \
            "$ARTIFACTS/linux-assets/dew-agent-linux-amd64" \
            "$ARTIFACTS/linux-assets/dew-agent-linux-arm64" \
            "$ARTIFACTS/linux-assets/dew-windows-x86_64.exe" \
            "$ARTIFACTS/linux-assets/dew-windows-arm64.exe" \
            "$ARTIFACTS/linux-assets/vmlinuz-x86_64" \
            "$ARTIFACTS/linux-assets/initramfs-minimal-x86_64.cpio.gz" \
            "$ARTIFACTS/linux-assets/initramfs-node-x86_64.cpio.gz" \
            "$ARTIFACTS/linux-assets/initramfs-standard-x86_64.cpio.gz" \
            "$ARTIFACTS/linux-assets/dew-rootfs-x86_64.tar.gz" \
            "$ARTIFACTS/linux-assets/dew-rootfs-aarch64.tar.gz" \
            prebuilt/aux/
          ls -la prebuilt/aux/

      - name: goreleaser
        # Pin to @v6 — @v7's self-verify step has broken on tags before.
        # distribution: goreleaser-pro unlocks `prebuilt` builder used for
        # the signed + notarized darwin binaries (Startup tier license,
        # paid via Stripe — see https://goreleaser.com/pro/).
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Bump brew formula on tap (custom — bypasses goreleaser brew)
        # Goreleaser's brews block hits 403 on POST /git/refs despite the
        # same App + token being able to create refs in isolation. Rather
        # than continue chasing the cause, we template Formula/dew.rb
        # directly here from the checksums.txt goreleaser just produced,
        # push a branch + open PR using the App-minted token.
        #
        # Token is passed via env (GH_TOKEN) so it stays in GHA secret
        # masking, never embedded in URLs that might be echoed.
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          REPO=solcreek/dew
          TAP=solcreek/homebrew-tap

          # SHA256s for each tarball, from goreleaser-produced checksums.txt
          sha() { grep "  $1\$" dist/checksums.txt | awk '{print $1}'; }
          DA=$(sha "dew_${VER}_darwin_arm64.tar.gz")
          DX=$(sha "dew_${VER}_darwin_amd64.tar.gz")
          LA=$(sha "dew_${VER}_linux_arm64.tar.gz")
          LX=$(sha "dew_${VER}_linux_amd64.tar.gz")
          [ -n "$DA" ] && [ -n "$DX" ] && [ -n "$LA" ] && [ -n "$LX" ] \
            || { echo "missing checksum for one of the tarballs"; exit 1; }

          # Clone tap. `gh auth setup-git` installs a credential helper
          # so `git push` uses GH_TOKEN without embedding it in any URL.
          gh auth setup-git
          git clone "https://github.com/${TAP}.git" /tmp/tap
          cd /tmp/tap
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git checkout -b "dew-${TAG}"

          cat > Formula/dew.rb <<FORMULA
          class Dew < Formula
            desc "Sandbox Linux compute on macOS — no Docker, no VPN, agent-friendly"
            homepage "https://dewvm.dev"
            version "${VER}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/${REPO}/releases/download/${TAG}/dew_${VER}_darwin_arm64.tar.gz"
                sha256 "${DA}"
              end
              on_intel do
                url "https://github.com/${REPO}/releases/download/${TAG}/dew_${VER}_darwin_amd64.tar.gz"
                sha256 "${DX}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/${REPO}/releases/download/${TAG}/dew_${VER}_linux_arm64.tar.gz"
                sha256 "${LA}"
              end
              on_intel do
                url "https://github.com/${REPO}/releases/download/${TAG}/dew_${VER}_linux_amd64.tar.gz"
                sha256 "${LX}"
              end
            end

            def install
              bin.install "dew"
            end

            def caveats
              <<~EOS
                Try:
                  dew run -- uname -a
              EOS
            end

            test do
              system "#{bin}/dew", "--version"
            end
          end
          FORMULA

          git add Formula/dew.rb
          git commit -m "Bump dew to ${TAG}"
          git push -u origin "dew-${TAG}"

          gh pr create --repo "$TAP" --base main --head "dew-${TAG}" \
            --title "Bump dew to ${TAG}" \
            --body "Auto-generated by solcreek/dew release workflow.

          Release: https://github.com/${REPO}/releases/tag/${TAG}"

          # Auto-merge immediately. No CI on the tap repo (formula is
          # auto-generated from goreleaser-verified checksums + cosign-
          # signed binaries; a tap-side CI would just duplicate work).
          # `--delete-branch` keeps the tap clean. Soft-fail because
          # the primary release artifacts are already shipped; a stuck
          # brew PR is a follow-up, not a release blocker.
          gh pr merge "dew-${TAG}" --repo "$TAP" --merge --delete-branch \
            || echo "::warning::auto-merge of brew formula PR failed — review solcreek/homebrew-tap manually"

      - name: compute artifact hashes for SLSA
        id: hashes
        # Hash every dist/ artifact — the tar.gz archives, checksums.txt,
        # cosign signature + cert. SLSA attestation pins the exact bytes.
        run: |
          set -euo pipefail
          cd dist
          hashes=$(sha256sum *.tar.gz checksums.txt checksums.txt.sig checksums.txt.pem | base64 -w0)
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

  # ─── SLSA Level 3 build provenance for goreleaser artifacts.
  #     Runs in its own reusable workflow with isolated permissions.
  provenance:
    needs: [goreleaser]
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true

  # ─── Publish thin dispatcher to npm via OIDC trusted publisher.
  #     Two packages from one source: `dew` (unscoped, primary) and
  #     `@solcreek/dew` (mirror, kept alive for back-compat with
  #     users who installed via the scoped name before we acquired
  #     the unscoped one). Same bytes published to both names so
  #     existing `npm i -g @solcreek/dew` workflows keep working
  #     without a version-skew between the two.
  npm-publish:
    needs: [goreleaser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm OIDC trusted publisher
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # node 24 → npm 11.x. OIDC trusted publishers require npm >= 11.5.1.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Copy README into npm package
        # npm/ has no README of its own; copy the repo root one so
        # npmjs.com shows it on the package page. Without this the
        # tarball ships bin/dew + package.json only and the npm page
        # is blank. Sits before sanity-test so the test sees the
        # same file layout the publish step does.
        run: cp README.md npm/README.md

      - name: Sanity-test dispatcher
        working-directory: npm
        run: npm test

      - name: Sync npm version to git tag
        working-directory: npm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish primary (dew, unscoped)
        working-directory: npm
        run: |
          set -euo pipefail
          if ! npm publish --provenance --access public 2> /tmp/npm-err.log; then
            if grep -qE 'E409|cannot publish over|previously published' /tmp/npm-err.log; then
              echo "::notice::dew@<version> already published, skipping"
            else
              cat /tmp/npm-err.log
              exit 1
            fi
          fi

      - name: Publish mirror (@solcreek/dew, same bytes)
        working-directory: npm
        # OIDC trusted-publisher entry for @solcreek/dew must also
        # be configured (npmjs.com → @solcreek/dew → Settings →
        # Trusted publishers, same workflow ref as the unscoped
        # one). If the OIDC entry is missing, this step fails and
        # the unscoped publish above still succeeds — primary
        # remains current, the mirror lags one version.
        run: |
          set -euo pipefail
          # Temporarily swap the name field, publish, then restore so
          # subsequent test runs / local dev see the canonical name.
          ORIG=$(node -e 'process.stdout.write(require("./package.json").name)')
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            pkg.name = "@solcreek/dew";
            fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          if ! npm publish --provenance --access public 2> /tmp/npm-err.log; then
            if grep -qE 'E409|cannot publish over|previously published' /tmp/npm-err.log; then
              echo "::notice::@solcreek/dew@<version> already published, skipping"
            else
              cat /tmp/npm-err.log
              echo "::warning::mirror publish failed (primary already shipped — mirror will catch up next release)"
            fi
          fi
          # Restore — repo source of truth is the unscoped name.
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            pkg.name = "'"$ORIG"'";
            fs.writeFileSync("./package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
