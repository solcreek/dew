name: Release Dry-Run

# Catches goreleaser config errors, missing fields, and build failures
# on PR — before a tag is cut and surprises hit the release pipeline.
# Runs only when files that affect the release shape change.

on:
  pull_request:
    paths:
      - '.goreleaser.yaml'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-dry-run.yml'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/dew/**'
      - 'install.sh'
      - 'install.ps1'
      - 'npm/**'
      - 'website/scripts/**'
      - 'website/package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: goreleaser check (config syntax + template lint)
        # Pro distribution required: .goreleaser.yaml uses `prebuilt:`
        # for the signed/notarized darwin binaries. Same config the
        # tag pipeline uses, so dry-run validates the real shape.
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: check
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: goreleaser build (linux only, snapshot)
        # Real darwin build needs prebuilt binaries from the build-macos
        # job which doesn't run here. Linux-only build catches changes
        # that break the goreleaser flow on the runner used in release.
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: build --snapshot --clean --id dew-linux --single-target
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

  npm-dispatcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Test npm dispatcher
        working-directory: npm
        run: npm test

  install-sh-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck install.sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck >/dev/null
          shellcheck install.sh

  # PowerShell parse + lint on Linux pwsh. Catches syntax errors
  # and the common landmines (Invoke-Expression on untrusted input,
  # hardcoded paths) before a release ships a broken installer.
  install-ps1-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse + PSScriptAnalyzer install.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Parse: fails on any syntax error.
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'install.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors; exit 1 }
          Write-Host "install.ps1 parse: OK"

          # PSScriptAnalyzer lint. Exclude PSAvoidUsingWriteHost —
          # the installer's whole purpose is to print progress to the
          # user's terminal; Write-Host is the right primitive for
          # that and every well-known PowerShell installer uses it.
          if (-not (Get-Command Invoke-ScriptAnalyzer -ErrorAction SilentlyContinue)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $results = Invoke-ScriptAnalyzer -Path install.ps1 `
            -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost
          if ($results) { $results | Format-Table; exit 1 }
          Write-Host "PSScriptAnalyzer: OK"

  # Guards the install-script sync mechanism: website's prebuild
  # copies /install.sh + /install.ps1 → website/public/ (gitignored).
  # If the sync script is broken or removed, this build fails. Also
  # asserts each built artifact matches the source byte-for-byte —
  # catches any tampering with the copy in the public/ dir.
  website-install-scripts-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install website deps
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build (runs prebuild sync)
        working-directory: website
        run: pnpm run build

      - name: Verify dist install scripts match source
        run: |
          for name in install.sh install.ps1; do
            diff -q "$name" "website/dist/$name"
            echo "$name sync: OK"
          done
